name: Go Cross-Platform Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Windows
          - os: windows
            arch: amd64
            ext: .exe
          - os: windows
            arch: 386
            ext: .exe
            
          # Linux
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: 386
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
            
          # macOS
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.18'
    
    - name: Build
      run: |
        GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
        go build -v \
        -o "bin/cf-hero-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" \
        ./cmd/cf-hero
    
    - name: Run tests (Linux only)
      if: matrix.os == 'linux' && matrix.arch == 'amd64'
      run: go test -v ./cmd/cf-hero
    
    - name: Compress binaries
      run: |
        cd bin
        # Windows 使用 zip 压缩
        if [[ "${{ matrix.os }}" == "windows" ]]; then
          zip "cf-hero-${{ matrix.os }}-${{ matrix.arch }}.zip" "cf-hero-${{ matrix.os }}-${{ matrix.arch }}.exe"
        # 其他系统使用 tar.gz
        else
          tar czf "cf-hero-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" "cf-hero-${{ matrix.os }}-${{ matrix.arch }}"
        fi
        cd ..
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-${{ matrix.arch }}-binaries
        path: bin/cf-hero-${{ matrix.os }}-${{ matrix.arch }}.*
    
  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create release bundle
        run: |
          mkdir release
          mv artifacts/*/* release/
          cd release
          ls -lh
          
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: cf-hero-release
          path: release/
